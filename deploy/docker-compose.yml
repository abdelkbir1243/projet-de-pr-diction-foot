# Plateforme Goalgebra : docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Services : proxy HTTPS (Caddy) · application (Streamlit) · API publique (FastAPI) · worker (calcul des données) ·
#            PostgreSQL · sauvegardes quotidiennes. Seul Caddy est exposé sur Internet (ports 80 et 443).
name: goalgebra

x-app: &app
  build: { context: .., dockerfile: Dockerfile }
  image: goalgebra:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://goalgebra:${POSTGRES_PASSWORD}@db:5432/goalgebra
    GOALGEBRA_DATA_DIR: /srv/data/current
    GOALGEBRA_PLATEFORME: "1"
  volumes:
    - donnees:/srv/data
  depends_on:
    db: { condition: service_healthy }
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp", "/app/data", "/home/goalgebra"]
  networks: [interne, public]        # accès Internet sortant : sources de données, API Claude, connexion Google

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAINE: ${DOMAINE}
      DOMAINE_API: ${DOMAINE_API}
      EMAIL_ACME: ${EMAIL_ACME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, api]
    networks: [interne, public]

  app:
    <<: *app
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0",
              "--server.enableXsrfProtection=true", "--server.enableCORS=true", "--browser.gatherUsageStats=false",
              "--server.maxUploadSize=1", "--client.showErrorDetails=false"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy: { resources: { limits: { memory: 1500m } } }

  api:
    <<: *app
    command: ["uvicorn", "plateforme.api:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers",
              "--forwarded-allow-ips", "*", "--workers", "2"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy: { resources: { limits: { memory: 512m } } }

  worker:
    <<: *app
    command: ["python", "-m", "plateforme.worker"]
    deploy: { resources: { limits: { memory: 2000m } } }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goalgebra
      POSTGRES_USER: goalgebra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalgebra -d goalgebra"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [interne]

  sauvegarde:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      GARDER_JOURS: ${SAUVEGARDE_JOURS:-14}
    volumes: ["./sauvegardes:/sauvegardes"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/sauvegardes/goalgebra-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h db -U goalgebra goalgebra | gzip > "$$f" && echo "sauvegarde $$f"
          find /sauvegardes -name 'goalgebra-*.sql.gz' -mtime +$$GARDER_JOURS -delete
          sleep 86400
        done
    depends_on:
      db: { condition: service_healthy }
    networks: [interne]

volumes:
  donnees: {}
  pg: {}
  caddy_data: {}
  caddy_config: {}

networks:
  interne: { internal: true }        # pas d'accès Internet direct pour la base
  public: {}
