name: Tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements-plateforme.txt
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t goalgebra:ci .
      - run: cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml --env-file deploy/.env config -q
      - name: Démarrage de l'API dans l'image
        run: |
          docker run -d --name api -e DATABASE_URL=sqlite:////tmp/t.db -p 8000:8000 goalgebra:ci uvicorn plateforme.api:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 20); do curl -fsS localhost:8000/v1/health && exit 0; sleep 2; done; docker logs api; exit 1
